<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Main Character — Transparent PNG 3D Widget</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  /* ===== 100% Transparent PNG-Like Background ===== */
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent !important;
    background-color: rgba(0, 0, 0, 0) !important;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: transparent !important;
    cursor: grab;
    touch-action: none;
  }
  #canvas-container:active {
    cursor: grabbing;
  }

  canvas {
    display: block;
    background: transparent !important;
  }

  /* ===== Clickable Character Logo Button - REMOVED PER MASTER DIRECTIVE ===== */
  .logo-download-btn {
    display: none !important;
  }
  .logo-svg {
    width: 34px;
    height: 34px;
    display: block;
    border-radius: 10px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<!-- Fullscreen Transparent 3D Character Canvas -->
<div id="canvas-container" aria-label="Transparent 3D Pixel Main Character"></div>

<script>
(() => {
  // ============================================================================
  // 1. EXPRESSIVE STATE & WEB AUDIO SYNTH
  // ============================================================================
  let audioCtx = null;
  let soundEnabled = true;
  let mouthTalkTimer = null;
  let isTalking = false;
  let currentMood = 'happy';
  let currentAction = 'idle';
  let actionTimer = null;

  const ensureAudio = () => {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  };

  const playTone = (freq = 520, dur = 0.065, type = 'square', vol = 0.05, slideTo = null) => {
    if (!soundEnabled) return;
    try {
      ensureAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + dur);
    } catch (e) {}
  };

  const sfx = {
    jump: () => {
      playTone(260, 0.14, 'square', 0.06, 760);
      setTimeout(() => playTone(760, 0.11, 'triangle', 0.05, 980), 80);
    },
    handshake: () => {
      [440, 554.37, 659.25, 880].forEach((f, i) =>
        setTimeout(() => playTone(f, 0.075, 'triangle', 0.06), i * 60)
      );
    },
    cheer: () => {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
        setTimeout(() => playTone(f, i === 3 ? 0.20 : 0.08, 'square', 0.06), i * 70)
      );
    },
    pop: () => playTone(620, 0.055, 'sine', 0.06, 880)
  };

  const triggerTalkingMouth = (durationMs = 1800) => {
    isTalking = true;
    clearTimeout(mouthTalkTimer);
    mouthTalkTimer = setTimeout(() => {
      isTalking = false;
      updateFaceTexture();
    }, durationMs);
  };

  // ============================================================================
  // 2. THREE.JS TRANSPARENT PNG-STYLE RENDERER (alpha: true, clearAlpha: 0)
  // ============================================================================
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = null;

  const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0.85, 11.2);
  camera.lookAt(0, 0.25, 0);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    premultipliedAlpha: false,
    preserveDrawingBuffer: true,
    powerPreference: 'high-performance'
  });
  renderer.setClearColor(0x000000, 0);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xd8ffe4, 0.85);
  scene.add(ambientLight);

  const keyLight = new THREE.DirectionalLight(0xffffff, 0.95);
  keyLight.position.set(6, 12, 9);
  scene.add(keyLight);

  const rimLightLeft = new THREE.DirectionalLight(0x80ffdb, 0.55);
  rimLightLeft.position.set(-8, 5, -6);
  scene.add(rimLightLeft);

  const rimLightRight = new THREE.PointLight(0x58cc02, 0.8, 18);
  rimLightRight.position.set(5, 3, 4);
  scene.add(rimLightRight);

  const worldGroup = new THREE.Group();
  worldGroup.position.y = -0.15;
  scene.add(worldGroup);

  function makePixelTexture(drawFn, size = 64) {
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    drawFn(ctx, size);
    const tex = new THREE.CanvasTexture(c);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    tex.needsUpdate = true;
    return { tex, canvas: c, ctx };
  }

  const bodySideSkin = makePixelTexture((ctx, s) => {
    const g = 8;
    const step = s / g;
    const palette = [
      ['#9BFF38','#8CF82B','#7CE828','#7CE828','#7CE828','#7CE828','#8CF82B','#9BFF38'],
      ['#8CF82B','#66D814','#58CC02','#58CC02','#58CC02','#58CC02','#66D814','#7CE828'],
      ['#7CE828','#58CC02','#46B002','#46B002','#46B002','#46B002','#58CC02','#66D814'],
      ['#66D814','#46B002','#3E9E02','#3E9E02','#3E9E02','#3E9E02','#46B002','#58CC02'],
      ['#58CC02','#46B002','#3E9E02','#368D02','#368D02','#3E9E02','#46B002','#58CC02'],
      ['#58CC02','#3E9E02','#368D02','#2E7C02','#2E7C02','#368D02','#3E9E02','#46B002'],
      ['#46B002','#368D02','#2E7C02','#266B02','#266B02','#2E7C02','#368D02','#3E9E02'],
      ['#368D02','#266B02','#1E5802','#1E5802','#1E5802','#1E5802','#266B02','#2E7C02']
    ];
    for (let y = 0; y < g; y++) {
      for (let x = 0; x < g; x++) {
        ctx.fillStyle = palette[y][x];
        ctx.fillRect(x * step, y * step, step, step);
      }
    }
    ctx.strokeStyle = '#A8FF48';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, s - 2, s - 2);
  }, 64);

  // ============================================================================
  // 3. INTACT PIXEL FACE TEXTURE (EYES, NOSE PIXEL, MOUTH & CHEEKS)
  // ============================================================================
  const faceCanvasObj = makePixelTexture(() => {}, 128);

  function updateFaceTexture(talkFrame = 0) {
    const ctx = faceCanvasObj.ctx;
    const s = 128;
    ctx.clearRect(0, 0, s, s);

    ctx.fillStyle = '#52C402';
    ctx.fillRect(0, 0, s, s);

    ctx.fillStyle = '#88FA2E';
    ctx.fillRect(0, 0, s, 8);
    ctx.fillRect(0, 0, 8, s);
    ctx.fillStyle = '#2B7A04';
    ctx.fillRect(0, s - 8, s, 8);
    ctx.fillRect(s - 8, 0, 8, s);

    ctx.fillStyle = '#1E8E04';
    ctx.fillRect(16, 16, 96, 96);

    ctx.fillStyle = 'rgba(184, 255, 80, 0.18)';
    ctx.fillRect(20, 20, 28, 6);
    ctx.fillRect(20, 26, 12, 6);

    const mood = currentMood;

    if (mood === 'happy' || mood === 'wink') {
      ctx.fillStyle = '#040B06';
      ctx.fillRect(26, 36, 26, 26);
      ctx.fillStyle = '#E8FFF0';
      ctx.fillRect(30, 40, 6, 6);

      if (mood === 'happy') {
        ctx.fillStyle = '#040B06';
        ctx.fillRect(76, 36, 26, 26);
        ctx.fillStyle = '#E8FFF0';
        ctx.fillRect(80, 40, 6, 6);
      } else {
        ctx.fillStyle = '#040B06';
        ctx.fillRect(92, 38, 8, 6);
        ctx.fillRect(84, 43, 8, 6);
        ctx.fillRect(76, 48, 8, 6);
        ctx.fillRect(84, 53, 8, 6);
        ctx.fillRect(92, 58, 8, 6);
      }
    } else if (mood === 'laugh') {
      ctx.fillStyle = '#040B06';
      ctx.fillRect(26, 38, 8, 6);
      ctx.fillRect(34, 43, 8, 6);
      ctx.fillRect(42, 48, 8, 6);
      ctx.fillRect(34, 53, 8, 6);
      ctx.fillRect(26, 58, 8, 6);

      ctx.fillRect(94, 38, 8, 6);
      ctx.fillRect(86, 43, 8, 6);
      ctx.fillRect(78, 48, 8, 6);
      ctx.fillRect(86, 53, 8, 6);
      ctx.fillRect(94, 58, 8, 6);
    } else if (mood === 'wow') {
      ctx.fillStyle = '#040B06';
      ctx.fillRect(24, 34, 30, 30);
      ctx.fillRect(74, 34, 30, 30);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(28, 38, 10, 10);
      ctx.fillRect(78, 38, 10, 10);
      ctx.fillStyle = '#80FFDB';
      ctx.fillRect(42, 52, 6, 6);
      ctx.fillRect(92, 52, 6, 6);
    } else if (mood === 'love') {
      ctx.fillStyle = '#FF2A6D';
      const drawHeart = (ox, oy) => {
        ctx.fillRect(ox + 4, oy, 8, 6);
        ctx.fillRect(ox + 16, oy, 8, 6);
        ctx.fillRect(ox, oy + 6, 28, 10);
        ctx.fillRect(ox + 4, oy + 16, 20, 6);
        ctx.fillRect(ox + 10, oy + 22, 8, 6);
      };
      drawHeart(25, 36);
      drawHeart(75, 36);
    } else if (mood === 'focused') {
      ctx.fillStyle = '#040B06';
      ctx.fillRect(26, 40, 26, 22);
      ctx.fillRect(76, 40, 26, 22);
      ctx.fillStyle = '#E8FFF0';
      ctx.fillRect(34, 44, 6, 6);
      ctx.fillRect(84, 44, 6, 6);
      ctx.fillStyle = '#040B06';
      ctx.fillRect(24, 30, 16, 6);
      ctx.fillRect(36, 34, 18, 6);
      ctx.fillRect(88, 30, 16, 6);
      ctx.fillRect(74, 34, 18, 6);
    } else if (mood === 'shock') {
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(24, 34, 28, 28);
      ctx.fillRect(76, 34, 28, 28);
      ctx.fillStyle = '#040B06';
      ctx.fillRect(34, 44, 8, 8);
      ctx.fillRect(86, 44, 8, 8);
    } else if (mood === 'sleepy') {
      ctx.fillStyle = '#040B06';
      ctx.fillRect(26, 52, 6, 6);
      ctx.fillRect(32, 46, 14, 6);
      ctx.fillRect(46, 52, 6, 6);

      ctx.fillRect(76, 52, 6, 6);
      ctx.fillRect(82, 46, 14, 6);
      ctx.fillRect(96, 52, 6, 6);
    } else if (mood === 'sad') {
      ctx.fillStyle = '#040B06';
      ctx.fillRect(26, 40, 26, 22);
      ctx.fillRect(76, 40, 26, 22);
      ctx.fillStyle = '#4DD8FF';
      ctx.fillRect(34, 62, 8, 16);
      ctx.fillRect(84, 62, 8, 16);
    }

    // Center Pixel Nose
    ctx.fillStyle = '#0D4F02';
    ctx.fillRect(60, 62, 8, 5);

    const showActiveMouth = isTalking || currentAction !== 'idle' || ['laugh', 'wow', 'shock', 'sad'].includes(mood);

    if (showActiveMouth) {
      ctx.fillStyle = 'rgba(255, 105, 155, 0.55)';
      ctx.fillRect(20, 68, 12, 6);
      ctx.fillRect(96, 68, 12, 6);

      if (mood === 'wow') {
        ctx.fillStyle = '#040B06';
        ctx.fillRect(56, 74, 16, 20);
        ctx.fillStyle = '#FF5C8A';
        ctx.fillRect(60, 82, 8, 8);
      } else if (mood === 'shock') {
        ctx.fillStyle = '#040B06';
        ctx.fillRect(48, 76, 32, 14);
        ctx.fillStyle = '#FF5C8A';
        ctx.fillRect(54, 82, 20, 6);
      } else if (mood === 'sad') {
        ctx.fillStyle = '#040B06';
        ctx.fillRect(52, 78, 24, 6);
        ctx.fillRect(46, 84, 6, 6);
        ctx.fillRect(76, 84, 6, 6);
      } else {
        const openH = (talkFrame % 2 === 0) ? 16 : 10;
        ctx.fillStyle = '#040B06';
        ctx.fillRect(48, 74, 32, openH);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(52, 74, 24, 4);
        if (openH > 12) {
          ctx.fillStyle = '#FF5C8A';
          ctx.fillRect(54, 82, 20, 6);
        }
      }
    }

    faceCanvasObj.tex.needsUpdate = true;
  }
  updateFaceTexture(0);

  // ============================================================================
  // 4. PURE MAIN CHARACTER ANATOMY ONLY (NO TURNTABLE / FLOOR / PEDESTAL)
  // ============================================================================
  const characterGroup = new THREE.Group();
  worldGroup.add(characterGroup);

  const touchableParts = [];
  const registerPart = (mesh, partName, actionTrigger) => {
    mesh.userData.partName = partName;
    mesh.userData.actionTrigger = actionTrigger;
    touchableParts.push(mesh);
  };

  const skinMat = new THREE.MeshStandardMaterial({
    map: bodySideSkin.tex,
    roughness: 0.32,
    metalness: 0.08
  });
  const faceMat = new THREE.MeshStandardMaterial({
    map: faceCanvasObj.tex,
    roughness: 0.25,
    metalness: 0.05
  });
  const limeHighlightMat = new THREE.MeshStandardMaterial({ color: 0xb8ff3b, roughness: 0.3 });
  const midGreenMat = new THREE.MeshStandardMaterial({ color: 0x58cc02, roughness: 0.35 });
  const darkGreenMat = new THREE.MeshStandardMaterial({ color: 0x2b8a04, roughness: 0.4 });
  const pinkAccentMat = new THREE.MeshStandardMaterial({ color: 0xff5ca8, roughness: 0.3 });
  const whiteFootMat = new THREE.MeshStandardMaterial({ color: 0xf8fff9, roughness: 0.25 });

  const bodyMaterials = [skinMat, skinMat, skinMat, skinMat, faceMat, skinMat];
  const torsoGeo = new THREE.BoxGeometry(2.9, 2.5, 2.3);
  const torsoMesh = new THREE.Mesh(torsoGeo, bodyMaterials);
  torsoMesh.position.set(0, 0.35, 0);
  characterGroup.add(torsoMesh);
  registerPart(torsoMesh, 'Torso & Face', 'nod');

  const glassShellGeo = new THREE.BoxGeometry(2.98, 2.58, 2.38);
  const glassShellMat = new THREE.MeshPhysicalMaterial({
    color: 0xb8ff50,
    transparent: true,
    opacity: 0.08,
    roughness: 0.08,
    clearcoat: 1.0
  });
  const glassShell = new THREE.Mesh(glassShellGeo, glassShellMat);
  torsoMesh.add(glassShell);

  function createVoxelEar(isLeft) {
    const earGroup = new THREE.Group();
    const xPos = isLeft ? -0.82 : 0.82;
    earGroup.position.set(xPos, 1.6, 0.05);

    const base = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.42, 0.54), midGreenMat);
    base.position.y = 0.21;
    earGroup.add(base);

    const mid = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.72, 0.48), midGreenMat);
    mid.position.y = 0.78;
    earGroup.add(mid);

    const innerPink = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.36, 0.52), pinkAccentMat);
    innerPink.position.set(0, 0.72, 0.02);
    earGroup.add(innerPink);

    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.32, 0.42), limeHighlightMat);
    tip.position.y = 1.30;
    earGroup.add(tip);

    const label = isLeft ? 'Left Ear' : 'Right Ear';
    registerPart(mid, label, 'ears');
    registerPart(tip, label, 'ears');
    return earGroup;
  }

  const earLeft = createVoxelEar(true);
  const earRight = createVoxelEar(false);
  characterGroup.add(earLeft, earRight);

  function createSideArm(isLeft) {
    const armGroup = new THREE.Group();
    const dir = isLeft ? -1 : 1;
    armGroup.position.set(dir * 1.48, 0.32, 0);

    const armBlock = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.96, 0.68), midGreenMat);
    armBlock.position.set(dir * 0.22, -0.18, 0);
    armGroup.add(armBlock);

    const topCap = new THREE.Mesh(new THREE.BoxGeometry(0.50, 0.24, 0.70), limeHighlightMat);
    topCap.position.set(dir * 0.22, 0.40, 0);
    armGroup.add(topCap);

    const handTip = new THREE.Mesh(new THREE.BoxGeometry(0.50, 0.22, 0.72), darkGreenMat);
    handTip.position.set(dir * 0.22, -0.72, 0);
    armGroup.add(handTip);

    const partLabel = isLeft ? 'Left Arm' : 'Right Arm';
    const actType = isLeft ? 'wave' : 'handshake';
    registerPart(armBlock, partLabel, actType);
    registerPart(handTip, partLabel, actType);
    return armGroup;
  }

  const armLeft = createSideArm(true);
  const armRight = createSideArm(false);
  characterGroup.add(armLeft, armRight);

  function createQuadLeg(x, z, label) {
    const legGroup = new THREE.Group();
    legGroup.position.set(x, -0.9, z);

    const cuff = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.22, 0.68), limeHighlightMat);
    cuff.position.y = -0.08;
    legGroup.add(cuff);

    const lowerLeg = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.74, 0.66), whiteFootMat);
    lowerLeg.position.y = -0.54;
    legGroup.add(lowerLeg);

    const greenStripe = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.13, 0.70), midGreenMat);
    greenStripe.position.y = -0.36;
    legGroup.add(greenStripe);

    registerPart(lowerLeg, label, 'walk');
    return legGroup;
  }

  const legFL = createQuadLeg(-0.82,  0.58, 'Front-Left Leg');
  const legFR = createQuadLeg( 0.82,  0.58, 'Front-Right Leg');
  const legBL = createQuadLeg(-0.82, -0.58, 'Back-Left Leg');
  const legBR = createQuadLeg( 0.82, -0.58, 'Back-Right Leg');
  characterGroup.add(legFL, legFR, legBL, legBR);

  const tailGroup = new THREE.Group();
  tailGroup.position.set(0, -0.32, -1.16);
  characterGroup.add(tailGroup);

  const tailSeg1 = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.42, 0.48), midGreenMat);
  tailSeg1.position.set(0, 0.05, -0.22);
  tailGroup.add(tailSeg1);

  const tailSeg2 = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.46), midGreenMat);
  tailSeg2.position.set(0, 0.26, -0.54);
  tailGroup.add(tailSeg2);

  const tailTip = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.32, 0.34), limeHighlightMat);
  tailTip.position.set(0, 0.48, -0.78);
  tailGroup.add(tailTip);

  registerPart(tailSeg1, 'Tail', 'tail');
  registerPart(tailTip,  'Tail', 'tail');

  // ============================================================================
  // 5. DIRECT BODY PART TOUCH, DRAG ROTATION & LOGO CLICK DIRECT HTML DOWNLOAD
  // ============================================================================
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let isDragging = false;
  let dragStartX = 0;
  let dragStartY = 0;
  let movedDistance = 0;

  let rotY = 0.18;
  let tiltX = 0.04;
  let rotVelocityY = 0;
  let tiltVelocityX = 0;

  let jumpVelocity = 0;
  let jumpOffset = 0;
  let squashStretchY = 1;

  function triggerJumpImpulse(strength = 0.70) {
    jumpVelocity = strength;
    squashStretchY = 1.18;
    sfx.jump();
  }

  function setMood(mood) {
    currentMood = mood;
    updateFaceTexture(0);
  }

  function triggerAction(act) {
    currentAction = act;
    clearTimeout(actionTimer);
    triggerTalkingMouth(2000);

    if (act === 'handshake') {
      rotVelocityY = (0.12 - (rotY % (Math.PI * 2))) * 0.08;
      sfx.handshake();
      triggerJumpImpulse(0.26);
      setMood('happy');
    } else if (act === 'wave') {
      sfx.pop();
      setMood('wink');
    } else if (act === 'both') {
      triggerJumpImpulse(0.45);
      sfx.cheer();
      setMood('laugh');
    } else if (act === 'nod') {
      sfx.pop();
      setMood('happy');
    } else if (act === 'walk') {
      sfx.pop();
      setMood('happy');
    } else if (act === 'dash') {
      sfx.jump();
      setMood('focused');
    } else if (act === 'tail') {
      sfx.pop();
      setMood('laugh');
    } else if (act === 'ears') {
      sfx.pop();
      setMood('wink');
    } else if (act === 'dance') {
      sfx.cheer();
      setMood('laugh');
    } else if (act === 'jump') {
      triggerJumpImpulse(0.92);
      setMood('wow');
    } else if (act === 'spin') {
      rotVelocityY += 0.35;
      triggerJumpImpulse(0.50);
      sfx.cheer();
      setMood('wow');
    }

    actionTimer = setTimeout(() => {
      currentAction = 'idle';
      currentMood = 'happy';
      updateFaceTexture(0);
    }, 3200);
  }

  // Clickable Character Logo -> Direct Standalone HTML Download
  const logoDownloadLink = document.getElementById('logoDownloadLink');
  logoDownloadLink.addEventListener('click', (e) => {
    e.preventDefault();
    const clone = document.documentElement.cloneNode(true);
    const canvasWrap = clone.querySelector('#canvas-container');
    if (canvasWrap) canvasWrap.innerHTML = '';

    const htmlString = '<!DOCTYPE html>\n' + clone.outerHTML;
    const blob = new Blob([htmlString], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    const tempLink = document.createElement('a');
    tempLink.href = url;
    tempLink.download = 'Main_Character_Transparent_PNG_Widget.html';
    document.body.appendChild(tempLink);
    tempLink.click();
    tempLink.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);

    sfx.cheer();
    triggerAction('handshake');
  });

  window.MainCharacter = {
    triggerAction,
    setMood,
    jump: () => triggerAction('jump'),
    handshake: () => triggerAction('handshake'),
    wave: () => triggerAction('wave'),
    walk: () => triggerAction('walk'),
    dash: () => triggerAction('dash'),
    dance: () => triggerAction('dance'),
    spin: () => triggerAction('spin')
  };

  window.addEventListener('message', (event) => {
    if (!event.data) return;
    if (event.data.action) triggerAction(event.data.action);
    if (event.data.mood) setMood(event.data.mood);
  });

  container.addEventListener('pointerdown', (e) => {
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    movedDistance = 0;
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    movedDistance += Math.abs(dx) + Math.abs(dy);
    dragStartX = e.clientX;
    dragStartY = e.clientY;

    rotVelocityY = dx * 0.0065;
    tiltVelocityX = dy * 0.0025;
    rotY += rotVelocityY;
    tiltX = Math.max(-0.28, Math.min(0.35, tiltX + tiltVelocityX));
  });

  window.addEventListener('pointerup', (e) => {
    if (!isDragging) return;
    isDragging = false;

    if (movedDistance < 10) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const hits = raycaster.intersectObjects(touchableParts, true);
      if (hits.length > 0) {
        let obj = hits[0].object;
        while (obj && !obj.userData.actionTrigger && obj.parent) obj = obj.parent;
        const actTrigger = (obj && obj.userData.actionTrigger) || 'handshake';
        triggerAction(actTrigger);
      }
    }
  });

  window.addEventListener('dblclick', () => {
    triggerAction('dance');
  });

  // ============================================================================
  // 6. 60FPS KINEMATICS, HANDSHAKE ARTICULATION & MOMENTUM PHYSICS LOOP
  // ============================================================================
  const clock = new THREE.Clock();
  let lastTalkTick = 0;

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    if (isTalking || currentAction !== 'idle') {
      const tick = Math.floor(t * 9);
      if (tick !== lastTalkTick) {
        lastTalkTick = tick;
        updateFaceTexture(tick);
      }
    }

    if (!isDragging) {
      rotY += rotVelocityY;
      tiltX += tiltVelocityX;
      rotVelocityY *= 0.94;
      tiltVelocityX *= 0.88;
      tiltX = Math.max(-0.28, Math.min(0.35, tiltX));
    }
    worldGroup.rotation.y += (rotY - worldGroup.rotation.y) * 0.18;
    worldGroup.rotation.x += (tiltX - worldGroup.rotation.x) * 0.18;

    if (jumpOffset > 0 || jumpVelocity !== 0) {
      jumpOffset += jumpVelocity;
      jumpVelocity -= 0.042;
      if (jumpOffset <= 0) {
        jumpOffset = 0;
        if (Math.abs(jumpVelocity) > 0.08) {
          squashStretchY = 0.84;
        }
        jumpVelocity = 0;
      }
    }
    squashStretchY += (1 - squashStretchY) * 0.16;
    characterGroup.scale.set(
      1 + (1 - squashStretchY) * 0.45,
      squashStretchY,
      1 + (1 - squashStretchY) * 0.45
    );

    const idleBreath = Math.sin(t * 2.8) * 0.06;
    const danceBounce = currentAction === 'dance' ? Math.abs(Math.sin(t * 9)) * 0.28 : 0;
    const sprintBounce = currentAction === 'dash' ? Math.abs(Math.sin(t * 16)) * 0.16 : 0;
    characterGroup.position.y = idleBreath + jumpOffset + danceBounce + sprintBounce;

    let targetPitchX = 0;
    if (currentAction === 'nod') {
      targetPitchX = Math.abs(Math.sin(t * 5.5)) * 0.34;
    } else if (currentAction === 'handshake') {
      targetPitchX = 0.12 + Math.sin(t * 11) * 0.03;
    } else if (currentAction === 'dash') {
      targetPitchX = 0.24;
    } else if (currentMood === 'sad') {
      targetPitchX = 0.10;
    }
    characterGroup.rotation.x += (targetPitchX - characterGroup.rotation.x) * 0.15;

    let targetRollZ = -rotVelocityY * 1.4;
    if (currentAction === 'dance') {
      targetRollZ += Math.sin(t * 4.8) * 0.14;
    } else if (currentAction === 'walk' || currentAction === 'dash') {
      targetRollZ += Math.sin(t * (currentAction === 'dash' ? 16 : 8)) * 0.06;
    }
    characterGroup.rotation.z += (targetRollZ - characterGroup.rotation.z) * 0.15;

    let targetArmRX = 0, targetArmRZ = Math.sin(t * 2.2) * 0.07, targetArmRY = 0;
    let targetArmLX = 0, targetArmLZ = -Math.sin(t * 2.2) * 0.07, targetArmLY = 0;

    if (currentAction === 'handshake') {
      targetArmRX = -1.15 + Math.sin(t * 13) * 0.26;
      targetArmRZ = 0.18;
      targetArmRY = -0.22;
      targetArmLX = 0.15;
      targetArmLZ = -0.18;
    } else if (currentAction === 'wave') {
      targetArmRZ = 0.72 + Math.sin(t * 14) * 0.36;
      targetArmRX = -0.25;
    } else if (currentAction === 'both' || currentAction === 'dance') {
      targetArmRZ =  0.70 + Math.sin(t * 12) * 0.32;
      targetArmLZ = -0.70 - Math.sin(t * 12) * 0.32;
    } else if (currentAction === 'dash' || currentAction === 'walk') {
      const armSwingSpeed = currentAction === 'dash' ? 16 : 8.5;
      const armSwingAmp = currentAction === 'dash' ? 0.65 : 0.32;
      targetArmRX =  Math.sin(t * armSwingSpeed) * armSwingAmp;
      targetArmLX = -Math.sin(t * armSwingSpeed) * armSwingAmp;
    }

    armRight.rotation.x += (targetArmRX - armRight.rotation.x) * 0.22;
    armRight.rotation.z += (targetArmRZ - armRight.rotation.z) * 0.22;
    armRight.rotation.y += (targetArmRY - armRight.rotation.y) * 0.22;

    armLeft.rotation.x += (targetArmLX - armLeft.rotation.x) * 0.22;
    armLeft.rotation.z += (targetArmLZ - armLeft.rotation.z) * 0.22;
    armLeft.rotation.y += (targetArmLY - armLeft.rotation.y) * 0.22;

    let walkSpeed = 2.6;
    let walkAmp = 0.05;
    if (currentAction === 'walk' || currentAction === 'dance') {
      walkSpeed = 10.5;
      walkAmp = 0.42;
    } else if (currentAction === 'dash') {
      walkSpeed = 18.0;
      walkAmp = 0.68;
    }
    legFL.rotation.x =  Math.sin(t * walkSpeed) * walkAmp;
    legBR.rotation.x =  Math.sin(t * walkSpeed) * walkAmp;
    legFR.rotation.x = -Math.sin(t * walkSpeed) * walkAmp;
    legBL.rotation.x = -Math.sin(t * walkSpeed) * walkAmp;

    const earSpeed = (currentAction === 'ears' || currentAction === 'dash') ? 13 : 2.4;
    const earAmp = (currentAction === 'ears' || currentAction === 'dash') ? 0.28 : 0.06;
    const earLagPitch = -jumpVelocity * 0.8 - (currentAction === 'dash' ? 0.28 : 0);
    earLeft.rotation.z  =  Math.sin(t * earSpeed) * earAmp;
    earRight.rotation.z = -Math.sin(t * earSpeed) * earAmp;
    earLeft.rotation.x  += (earLagPitch - earLeft.rotation.x) * 0.18;
    earRight.rotation.x += (earLagPitch - earRight.rotation.x) * 0.18;

    const tailSpeed = (currentAction === 'tail' || currentAction === 'dance' || currentAction === 'handshake' || currentAction === 'dash') ? 15 : 4.2;
    const tailAmp = (currentAction === 'tail' || currentAction === 'dance' || currentAction === 'handshake') ? 0.52 : 0.18;
    tailGroup.rotation.y = Math.sin(t * tailSpeed) * tailAmp - rotVelocityY * 2.2;
    tailGroup.rotation.x = Math.cos(t * tailSpeed * 0.5) * 0.09;

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  window.onload = () => {
    animate();
  };
})();
</script>
