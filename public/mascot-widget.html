<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Study Buddy Royal — 3D Green Mascot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent !important;
    background-color: rgba(0, 0, 0, 0) !important;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: transparent !important;
    cursor: grab;
    touch-action: none;
  }
  #canvas-container:active {
    cursor: grabbing;
  }

  canvas {
    display: block;
    background: transparent !important;
  }
</style>
</head>
<body>

<div id="canvas-container" aria-label="Transparent 3D Duolingo Style Green Study Buddy Mascot"></div>

<script>
(() => {
  // ============================================================================
  // 1. WEB AUDIO SYNTH (DUOLINGO-STYLE RETRO SFX)
  // ============================================================================
  let audioCtx = null;
  let soundEnabled = true;
  let mouthTalkTimer = null;
  let isTalking = false;
  let currentMood = 'happy';
  let currentAction = 'idle';
  let actionTimer = null;
  let idleTimer = null;

  const ensureAudio = () => {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  };

  const playTone = (freq = 520, dur = 0.065, type = 'square', vol = 0.05, slideTo = null) => {
    if (!soundEnabled) return;
    try {
      ensureAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + dur);
    } catch (e) {}
  };

  const sfx = {
    jump: () => {
      playTone(260, 0.14, 'square', 0.06, 760);
      setTimeout(() => playTone(760, 0.11, 'triangle', 0.05, 980), 80);
    },
    cheer: () => {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
        setTimeout(() => playTone(f, i === 3 ? 0.22 : 0.08, 'square', 0.06), i * 70)
      );
    },
    pop: () => playTone(620, 0.055, 'sine', 0.06, 880),
    angry: () => {
      [140, 120, 110, 95].forEach((f, i) =>
        setTimeout(() => playTone(f, 0.12, 'sawtooth', 0.08, f - 25), i * 65)
      );
    },
    sip: () => {
      playTone(480, 0.06, 'sine', 0.04, 720);
      setTimeout(() => playTone(640, 0.08, 'sine', 0.05, 840), 90);
    },
    streak: () => {
      [330, 440, 554, 659, 880].forEach((f, i) =>
        setTimeout(() => playTone(f, 0.10, 'triangle', 0.06, f * 1.05), i * 55)
      );
    },
    trophy: () => {
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) =>
        setTimeout(() => playTone(f, i === 4 ? 0.35 : 0.09, 'square', 0.07), i * 65)
      );
    },
    thinking: () => {
      playTone(400, 0.09, 'sine', 0.05, 520);
      setTimeout(() => playTone(540, 0.14, 'sine', 0.05, 660), 120);
    }
  };

  const triggerTalkingMouth = (durationMs = 1800) => {
    isTalking = true;
    clearTimeout(mouthTalkTimer);
    mouthTalkTimer = setTimeout(() => {
      isTalking = false;
      updateFaceTexture();
    }, durationMs);
  };

  // ============================================================================
  // 2. THREE.JS RENDERER & SCENE SETUP
  // ============================================================================
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = null;

  const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0.85, 11.2);
  camera.lookAt(0, 0.25, 0);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    premultipliedAlpha: false,
    preserveDrawingBuffer: true,
    powerPreference: 'high-performance'
  });
  renderer.setClearColor(0x000000, 0);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xd8ffe4, 0.90);
  scene.add(ambientLight);

  const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
  keyLight.position.set(6, 12, 9);
  scene.add(keyLight);

  const rimLightLeft = new THREE.DirectionalLight(0x80ffdb, 0.6);
  rimLightLeft.position.set(-8, 5, -6);
  scene.add(rimLightLeft);

  const rimLightRight = new THREE.PointLight(0x58cc02, 0.9, 18);
  rimLightRight.position.set(5, 3, 4);
  scene.add(rimLightRight);

  const worldGroup = new THREE.Group();
  worldGroup.position.y = -0.15;
  scene.add(worldGroup);

  function makePixelTexture(drawFn, size = 64) {
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    drawFn(ctx, size);
    const tex = new THREE.CanvasTexture(c);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    tex.needsUpdate = true;
    return { tex, canvas: c, ctx };
  }

  const bodySideSkin = makePixelTexture((ctx, s) => {
    const g = 8;
    const step = s / g;
    const palette = [
      ['#9BFF38','#8CF82B','#7CE828','#7CE828','#7CE828','#7CE828','#8CF82B','#9BFF38'],
      ['#8CF82B','#66D814','#58CC02','#58CC02','#58CC02','#58CC02','#66D814','#7CE828'],
      ['#7CE828','#58CC02','#46B002','#46B002','#46B002','#46B002','#58CC02','#66D814'],
      ['#66D814','#46B002','#3E9E02','#3E9E02','#3E9E02','#3E9E02','#46B002','#58CC02'],
      ['#58CC02','#46B002','#3E9E02','#368D02','#368D02','#3E9E02','#46B002','#58CC02'],
      ['#58CC02','#3E9E02','#368D02','#2E7C02','#2E7C02','#368D02','#3E9E02','#46B002'],
      ['#46B002','#368D02','#2E7C02','#266B02','#266B02','#2E7C02','#368D02','#3E9E02'],
      ['#368D02','#266B02','#1E5802','#1E5802','#1E5802','#1E5802','#266B02','#2E7C02']
    ];
    for (let y = 0; y < g; y++) {
      for (let x = 0; x < g; x++) {
        ctx.fillStyle = palette[y][x];
        ctx.fillRect(x * step, y * step, step, step);
      }
    }
    ctx.strokeStyle = '#A8FF48';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, s - 2, s - 2);
  }, 64);

  // ============================================================================
  // 3. PIXEL FACE TEXTURE WITH DUOLINGO EXPRESSIONS (ANGRY, THINKING, STREAK, ETC)
  // ============================================================================
  const faceCanvasObj = makePixelTexture(() => {}, 128);

  function updateFaceTexture(talkFrame = 0) {
    const ctx = faceCanvasObj.ctx;
    const s = 128;
    ctx.clearRect(0, 0, s, s);

    // Green base
    ctx.fillStyle = currentMood === 'angry' ? '#E11D48' : '#52C402';
    ctx.fillRect(0, 0, s, s);

    // Border shading
    ctx.fillStyle = currentMood === 'angry' ? '#FB7185' : '#88FA2E';
    ctx.fillRect(0, 0, s, 8);
    ctx.fillRect(0, 0, 8, s);
    ctx.fillStyle = currentMood === 'angry' ? '#9F1239' : '#2B7A04';
    ctx.fillRect(0, s - 8, s, 8);
    ctx.fillRect(s - 8, 0, 8, s);

    // Inner shadow
    ctx.fillStyle = currentMood === 'angry' ? '#BE123C' : '#1E8E04';
    ctx.fillRect(16, 16, 96, 96);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
    ctx.fillRect(20, 20, 28, 6);
    ctx.fillRect(20, 26, 12, 6);

    const mood = currentMood;

    if (mood === 'angry') {
      // Fierce slanting angry eyebrows
      ctx.fillStyle = '#040B06';
      ctx.fillRect(20, 30, 32, 8);
      ctx.fillRect(76, 30, 32, 8);
      // Angular eyes
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(26, 38, 22, 18);
      ctx.fillRect(80, 38, 22, 18);
      ctx.fillStyle = '#EF4444';
      ctx.fillRect(32, 42, 10, 12);
      ctx.fillRect(86, 42, 10, 12);
    } else if (mood === 'thinking') {
      // One eyebrow raised, looking up
      ctx.fillStyle = '#040B06';
      ctx.fillRect(24, 28, 22, 6);
      ctx.fillRect(80, 34, 22, 6);
      // Eyes looking up-right
      ctx.fillStyle = '#040B06';
      ctx.fillRect(26, 36, 24, 24);
      ctx.fillRect(78, 36, 24, 24);
      ctx.fillStyle = '#E8FFF0';
      ctx.fillRect(36, 38, 8, 8);
      ctx.fillRect(88, 38, 8, 8);
    } else if (mood === 'streak') {
      // Blazing golden fiery eyes
      ctx.fillStyle = '#F59E0B';
      ctx.fillRect(24, 34, 28, 28);
      ctx.fillRect(76, 34, 28, 28);
      ctx.fillStyle = '#FEF08A';
      ctx.fillRect(30, 40, 14, 14);
      ctx.fillRect(82, 40, 14, 14);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(34, 44, 6, 6);
      ctx.fillRect(86, 44, 6, 6);
    } else if (mood === 'happy' || mood === 'wink') {
      ctx.fillStyle = '#040B06';
      ctx.fillRect(26, 36, 26, 26);
      ctx.fillStyle = '#E8FFF0';
      ctx.fillRect(30, 40, 6, 6);

      if (mood === 'happy') {
        ctx.fillStyle = '#040B06';
        ctx.fillRect(76, 36, 26, 26);
        ctx.fillStyle = '#E8FFF0';
        ctx.fillRect(80, 40, 6, 6);
      } else {
        ctx.fillStyle = '#040B06';
        ctx.fillRect(92, 38, 8, 6);
        ctx.fillRect(84, 43, 8, 6);
        ctx.fillRect(76, 48, 8, 6);
        ctx.fillRect(84, 53, 8, 6);
        ctx.fillRect(92, 58, 8, 6);
      }
    } else if (mood === 'laugh') {
      ctx.fillStyle = '#040B06';
      ctx.fillRect(26, 38, 8, 6);
      ctx.fillRect(34, 43, 8, 6);
      ctx.fillRect(42, 48, 8, 6);
      ctx.fillRect(34, 53, 8, 6);
      ctx.fillRect(26, 58, 8, 6);

      ctx.fillRect(94, 38, 8, 6);
      ctx.fillRect(86, 43, 8, 6);
      ctx.fillRect(78, 48, 8, 6);
      ctx.fillRect(86, 53, 8, 6);
      ctx.fillRect(94, 58, 8, 6);
    } else if (mood === 'wow') {
      ctx.fillStyle = '#040B06';
      ctx.fillRect(24, 34, 30, 30);
      ctx.fillRect(74, 34, 30, 30);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(28, 38, 10, 10);
      ctx.fillRect(78, 38, 10, 10);
      ctx.fillStyle = '#80FFDB';
      ctx.fillRect(42, 52, 6, 6);
      ctx.fillRect(92, 52, 6, 6);
    } else if (mood === 'sad') {
      ctx.fillStyle = '#040B06';
      ctx.fillRect(26, 40, 26, 22);
      ctx.fillRect(76, 40, 26, 22);
      ctx.fillStyle = '#38BDF8';
      ctx.fillRect(34, 62, 8, 16);
      ctx.fillRect(84, 62, 8, 16);
    } else {
      ctx.fillStyle = '#040B06';
      ctx.fillRect(26, 36, 26, 26);
      ctx.fillRect(76, 36, 26, 26);
      ctx.fillStyle = '#E8FFF0';
      ctx.fillRect(30, 40, 6, 6);
      ctx.fillRect(80, 40, 6, 6);
    }

    // Center Pixel Nose
    ctx.fillStyle = currentMood === 'angry' ? '#881337' : '#0D4F02';
    ctx.fillRect(60, 62, 8, 5);

    // Mouth rendering
    if (mood === 'angry') {
      // Gritted teeth
      ctx.fillStyle = '#040B06';
      ctx.fillRect(44, 76, 40, 12);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(46, 78, 36, 8);
      ctx.fillStyle = '#040B06';
      ctx.fillRect(54, 78, 2, 8);
      ctx.fillRect(64, 78, 2, 8);
      ctx.fillRect(74, 78, 2, 8);
    } else if (mood === 'thinking') {
      // Small 'o' mouth or side smirk
      ctx.fillStyle = '#040B06';
      ctx.fillRect(66, 76, 12, 10);
      ctx.fillStyle = '#FF5C8A';
      ctx.fillRect(68, 80, 8, 5);
    } else if (isTalking || currentAction !== 'idle' || ['laugh', 'wow', 'sad'].includes(mood)) {
      ctx.fillStyle = 'rgba(255, 105, 155, 0.55)';
      ctx.fillRect(20, 68, 12, 6);
      ctx.fillRect(96, 68, 12, 6);

      const openH = (talkFrame % 2 === 0) ? 16 : 10;
      ctx.fillStyle = '#040B06';
      ctx.fillRect(48, 74, 32, openH);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(52, 74, 24, 4);
      if (openH > 12) {
        ctx.fillStyle = '#FF5C8A';
        ctx.fillRect(54, 82, 20, 6);
      }
    } else {
      // Gentle happy smile
      ctx.fillStyle = '#040B06';
      ctx.fillRect(52, 78, 24, 6);
      ctx.fillRect(48, 74, 4, 6);
      ctx.fillRect(76, 74, 4, 6);
    }

    faceCanvasObj.tex.needsUpdate = true;
  }
  updateFaceTexture(0);

  // ============================================================================
  // 4. MAIN CHARACTER 3D MESH ANATOMY
  // ============================================================================
  const characterGroup = new THREE.Group();
  worldGroup.add(characterGroup);

  const touchableParts = [];
  const registerPart = (mesh, partName, actionTrigger) => {
    mesh.userData.partName = partName;
    mesh.userData.actionTrigger = actionTrigger;
    touchableParts.push(mesh);
  };

  const skinMat = new THREE.MeshStandardMaterial({
    map: bodySideSkin.tex,
    roughness: 0.32,
    metalness: 0.08
  });
  const faceMat = new THREE.MeshStandardMaterial({
    map: faceCanvasObj.tex,
    roughness: 0.25,
    metalness: 0.05
  });
  const limeHighlightMat = new THREE.MeshStandardMaterial({ color: 0xb8ff3b, roughness: 0.3 });
  const midGreenMat = new THREE.MeshStandardMaterial({ color: 0x58cc02, roughness: 0.35 });
  const darkGreenMat = new THREE.MeshStandardMaterial({ color: 0x2b8a04, roughness: 0.4 });
  const pinkAccentMat = new THREE.MeshStandardMaterial({ color: 0xff5ca8, roughness: 0.3 });
  const whiteFootMat = new THREE.MeshStandardMaterial({ color: 0xf8fff9, roughness: 0.25 });
  const goldMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.2, metalness: 0.8 });

  // Torso
  const bodyMaterials = [skinMat, skinMat, skinMat, skinMat, faceMat, skinMat];
  const torsoGeo = new THREE.BoxGeometry(2.9, 2.5, 2.3);
  const torsoMesh = new THREE.Mesh(torsoGeo, bodyMaterials);
  torsoMesh.position.set(0, 0.35, 0);
  characterGroup.add(torsoMesh);
  registerPart(torsoMesh, 'Torso & Face', 'nod');

  // Ears
  function createVoxelEar(isLeft) {
    const earGroup = new THREE.Group();
    const xPos = isLeft ? -0.82 : 0.82;
    earGroup.position.set(xPos, 1.6, 0.05);

    const base = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.42, 0.54), midGreenMat);
    base.position.y = 0.21;
    earGroup.add(base);

    const mid = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.72, 0.48), midGreenMat);
    mid.position.y = 0.78;
    earGroup.add(mid);

    const innerPink = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.36, 0.52), pinkAccentMat);
    innerPink.position.set(0, 0.72, 0.02);
    earGroup.add(innerPink);

    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.32, 0.42), limeHighlightMat);
    tip.position.y = 1.30;
    earGroup.add(tip);

    const label = isLeft ? 'Left Ear' : 'Right Ear';
    registerPart(mid, label, 'ears');
    registerPart(tip, label, 'ears');
    return earGroup;
  }

  const earLeft = createVoxelEar(true);
  const earRight = createVoxelEar(false);
  characterGroup.add(earLeft, earRight);

  // Arms
  function createSideArm(isLeft) {
    const armGroup = new THREE.Group();
    const dir = isLeft ? -1 : 1;
    armGroup.position.set(dir * 1.48, 0.32, 0);

    const armBlock = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.96, 0.68), midGreenMat);
    armBlock.position.set(dir * 0.22, -0.18, 0);
    armGroup.add(armBlock);

    const topCap = new THREE.Mesh(new THREE.BoxGeometry(0.50, 0.24, 0.70), limeHighlightMat);
    topCap.position.set(dir * 0.22, 0.40, 0);
    armGroup.add(topCap);

    const handTip = new THREE.Mesh(new THREE.BoxGeometry(0.50, 0.22, 0.72), darkGreenMat);
    handTip.position.set(dir * 0.22, -0.72, 0);
    armGroup.add(handTip);

    const partLabel = isLeft ? 'Left Arm' : 'Right Arm';
    const actType = isLeft ? 'wave' : 'drinking_tea';
    registerPart(armBlock, partLabel, actType);
    registerPart(handTip, partLabel, actType);
    return armGroup;
  }

  const armLeft = createSideArm(true);
  const armRight = createSideArm(false);
  characterGroup.add(armLeft, armRight);

  // Legs
  function createQuadLeg(x, z, label) {
    const legGroup = new THREE.Group();
    legGroup.position.set(x, -0.9, z);

    const cuff = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.22, 0.68), limeHighlightMat);
    cuff.position.y = -0.08;
    legGroup.add(cuff);

    const lowerLeg = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.74, 0.66), whiteFootMat);
    lowerLeg.position.y = -0.54;
    legGroup.add(lowerLeg);

    registerPart(lowerLeg, label, 'walk');
    return legGroup;
  }

  const legFL = createQuadLeg(-0.82,  0.58, 'Front-Left Leg');
  const legFR = createQuadLeg( 0.82,  0.58, 'Front-Right Leg');
  const legBL = createQuadLeg(-0.82, -0.58, 'Back-Left Leg');
  const legBR = createQuadLeg( 0.82, -0.58, 'Back-Right Leg');
  characterGroup.add(legFL, legFR, legBL, legBR);

  // Tail
  const tailGroup = new THREE.Group();
  tailGroup.position.set(0, -0.32, -1.16);
  characterGroup.add(tailGroup);
  const tailSeg = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.42, 0.48), midGreenMat);
  tailSeg.position.set(0, 0.05, -0.22);
  tailGroup.add(tailSeg);

  // ============================================================================
  // 5. DUOLINGO SPECIAL 3D PROPS (TEA MUG, GOLD TROPHY, QUESTION MARK, STEAM, FLAMES)
  // ============================================================================
  
  // A. Tea / Coffee Mug Prop
  const teaMugGroup = new THREE.Group();
  const mugBody = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.22, 0.44, 12), new THREE.MeshStandardMaterial({ color: 0xFDFBF7, roughness: 0.2 }));
  const mugCoffee = new THREE.Mesh(new THREE.CircleGeometry(0.22, 12), new THREE.MeshStandardMaterial({ color: 0x5C381E, roughness: 0.4 }));
  mugCoffee.rotation.x = -Math.PI / 2;
  mugCoffee.position.y = 0.21;
  const mugHandle = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.04, 8, 12, Math.PI), new THREE.MeshStandardMaterial({ color: 0xFDFBF7 }));
  mugHandle.rotation.z = Math.PI / 2;
  mugHandle.position.set(0.25, 0, 0);
  teaMugGroup.add(mugBody, mugCoffee, mugHandle);
  teaMugGroup.position.set(1.4, 0.1, 1.1);
  teaMugGroup.visible = false;
  characterGroup.add(teaMugGroup);

  // B. Golden Duolingo Trophy Cup Prop
  const trophyGroup = new THREE.Group();
  const trophyCup = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.25, 0.75, 14), goldMat);
  const trophyStem = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.4, 10), goldMat);
  trophyStem.position.y = -0.45;
  const trophyBase = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.2, 0.65), new THREE.MeshStandardMaterial({ color: 0x1E293B, roughness: 0.3 }));
  trophyBase.position.y = -0.7;
  const trophyStar = new THREE.Mesh(new THREE.OctahedronGeometry(0.25), new THREE.MeshStandardMaterial({ color: 0xFFFBEB, emissive: 0xF59E0B }));
  trophyStar.position.y = 0.55;
  trophyGroup.add(trophyCup, trophyStem, trophyBase, trophyStar);
  trophyGroup.position.set(0, 2.5, 0.6);
  trophyGroup.scale.set(0.8, 0.8, 0.8);
  trophyGroup.visible = false;
  characterGroup.add(trophyGroup);

  // C. Thinking Floating Question Mark Prop
  const questionMarkGroup = new THREE.Group();
  const qTop = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.07, 8, 12, Math.PI * 1.5), goldMat);
  qTop.rotation.z = -Math.PI / 4;
  const qDot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), goldMat);
  qDot.position.set(0, -0.48, 0);
  questionMarkGroup.add(qTop, qDot);
  questionMarkGroup.position.set(1.2, 2.4, 0.4);
  questionMarkGroup.visible = false;
  characterGroup.add(questionMarkGroup);

  // D. Particle System: Steam, Confetti & Flame particles
  const particleCount = 40;
  const particleGeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
  const particles = [];
  const particleGroup = new THREE.Group();
  characterGroup.add(particleGroup);

  const colors = [0xFBBF24, 0xEF4444, 0x3B82F6, 0x10B981, 0xEC4899, 0xFFFFFF];
  for (let i = 0; i < particleCount; i++) {
    const mat = new THREE.MeshStandardMaterial({
      color: colors[i % colors.length],
      roughness: 0.3,
      transparent: true,
      opacity: 0.9
    });
    const pMesh = new THREE.Mesh(particleGeo, mat);
    pMesh.visible = false;
    particleGroup.add(pMesh);
    particles.push({
      mesh: pMesh,
      vx: 0,
      vy: 0,
      vz: 0,
      rotX: 0,
      rotY: 0,
      life: 0,
      maxLife: 1
    });
  }

  function spawnParticles(type = 'confetti') {
    particles.forEach((p, idx) => {
      p.mesh.visible = true;
      p.life = 0;
      p.maxLife = 1.0 + Math.random() * 0.8;
      if (type === 'steam') {
        p.mesh.position.set(
          (Math.random() - 0.5) * 0.2 + (currentAction === 'drinking_tea' ? 1.4 : (idx % 2 === 0 ? -0.8 : 0.8)),
          currentAction === 'drinking_tea' ? 0.4 : 2.5,
          currentAction === 'drinking_tea' ? 1.1 : 0.1
        );
        p.vx = (Math.random() - 0.5) * 0.03;
        p.vy = 0.04 + Math.random() * 0.04;
        p.vz = (Math.random() - 0.5) * 0.03;
        p.mesh.material.color.setHex(currentMood === 'angry' ? 0xEF4444 : 0xFFFFFF);
      } else if (type === 'flame') {
        p.mesh.position.set((Math.random() - 0.5) * 2.2, -0.6 + Math.random() * 0.6, (Math.random() - 0.5) * 1.8);
        p.vx = (Math.random() - 0.5) * 0.05;
        p.vy = 0.08 + Math.random() * 0.08;
        p.vz = (Math.random() - 0.5) * 0.05;
        p.mesh.material.color.setHex(Math.random() > 0.4 ? 0xF59E0B : 0xEF4444);
      } else {
        // Confetti
        p.mesh.position.set((Math.random() - 0.5) * 1.5, 2.2 + Math.random() * 0.8, (Math.random() - 0.5) * 1.2);
        p.vx = (Math.random() - 0.5) * 0.09;
        p.vy = 0.06 + Math.random() * 0.07;
        p.vz = (Math.random() - 0.5) * 0.09;
        p.mesh.material.color.setHex(colors[idx % colors.length]);
      }
      p.rotX = Math.random() * 0.2;
      p.rotY = Math.random() * 0.2;
    });
  }

  // ============================================================================
  // 6. DUOLINGO ACTIONS SYSTEM
  // ============================================================================
  let isDragging = false;
  let dragStartX = 0, dragStartY = 0, movedDistance = 0;
  let rotY = 0.18, tiltX = 0.04, rotVelocityY = 0, tiltVelocityX = 0;
  let jumpVelocity = 0, jumpOffset = 0, squashStretchY = 1;

  function triggerJumpImpulse(strength = 0.70) {
    jumpVelocity = strength;
    squashStretchY = 1.18;
    sfx.jump();
  }

  function setMood(mood) {
    currentMood = mood;
    updateFaceTexture(0);
  }

  function triggerAction(act) {
    currentAction = act;
    clearTimeout(actionTimer);
    triggerTalkingMouth(2200);

    // Hide all props by default
    teaMugGroup.visible = false;
    trophyGroup.visible = false;
    questionMarkGroup.visible = false;

    if (act === 'drinking_tea' || act === 'drinking_coffee') {
      teaMugGroup.visible = true;
      setMood('happy');
      sfx.sip();
      spawnParticles('steam');
    } else if (act === 'angry') {
      setMood('angry');
      sfx.angry();
      spawnParticles('steam');
    } else if (act === 'streak_fire' || act === 'streak') {
      setMood('streak');
      triggerJumpImpulse(0.55);
      sfx.streak();
      spawnParticles('flame');
    } else if (act === 'trophy_celebrate' || act === 'win') {
      trophyGroup.visible = true;
      setMood('wow');
      triggerJumpImpulse(0.85);
      sfx.trophy();
      spawnParticles('confetti');
    } else if (act === 'thinking') {
      questionMarkGroup.visible = true;
      setMood('thinking');
      sfx.thinking();
    } else if (act === 'cheer') {
      triggerJumpImpulse(0.75);
      sfx.cheer();
      setMood('laugh');
      spawnParticles('confetti');
    } else if (act === 'sad') {
      setMood('sad');
      playTone(180, 0.2, 'sawtooth', 0.05, 120);
    } else if (act === 'wave') {
      sfx.pop();
      setMood('wink');
    } else if (act === 'dance') {
      sfx.cheer();
      setMood('laugh');
    } else if (act === 'jump') {
      triggerJumpImpulse(0.92);
      setMood('wow');
    } else if (act === 'nod') {
      sfx.pop();
      setMood('happy');
    } else {
      setMood('happy');
    }

    actionTimer = setTimeout(() => {
      currentAction = 'idle';
      currentMood = 'happy';
      teaMugGroup.visible = false;
      trophyGroup.visible = false;
      questionMarkGroup.visible = false;
      particles.forEach(p => p.mesh.visible = false);
      updateFaceTexture(0);
    }, 4000);
  }

  // Periodic cute Duolingo ambient behaviors (every 10 seconds if idle)
  const resetIdleTimer = () => {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (currentAction === 'idle' && !isDragging) {
        const r = Math.random();
        if (r < 0.35) {
          triggerAction('thinking');
        } else if (r < 0.65) {
          triggerAction('drinking_tea');
        } else if (r < 0.85) {
          triggerAction('wave');
        } else {
          triggerAction('nod');
        }
      }
      resetIdleTimer();
    }, 11000);
  };
  resetIdleTimer();

  // Expose global API
  window.MainCharacter = {
    triggerAction,
    setMood,
    drinkingTea: () => triggerAction('drinking_tea'),
    drinkingCoffee: () => triggerAction('drinking_coffee'),
    angry: () => triggerAction('angry'),
    streakFire: () => triggerAction('streak_fire'),
    trophyCelebrate: () => triggerAction('trophy_celebrate'),
    thinking: () => triggerAction('thinking'),
    cheer: () => triggerAction('cheer'),
    sad: () => triggerAction('sad'),
    jump: () => triggerAction('jump'),
    wave: () => triggerAction('wave'),
    dance: () => triggerAction('dance')
  };

  // Listen to postMessage from parent iframe
  window.addEventListener('message', (event) => {
    if (!event.data) return;
    if (event.data.action) triggerAction(event.data.action);
    if (event.data.mood) setMood(event.data.mood);
  });

  // Touch and Drag Interactions
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  container.addEventListener('pointerdown', (e) => {
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    movedDistance = 0;
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    movedDistance += Math.abs(dx) + Math.abs(dy);
    dragStartX = e.clientX;
    dragStartY = e.clientY;

    rotVelocityY = dx * 0.0065;
    tiltVelocityX = dy * 0.0025;
    rotY += rotVelocityY;
    tiltX = Math.max(-0.28, Math.min(0.35, tiltX + tiltVelocityX));
  });

  window.addEventListener('pointerup', (e) => {
    if (!isDragging) return;
    isDragging = false;

    if (movedDistance < 10) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const hits = raycaster.intersectObjects(touchableParts, true);
      if (hits.length > 0) {
        let obj = hits[0].object;
        while (obj && !obj.userData.actionTrigger && obj.parent) obj = obj.parent;
        const actTrigger = (obj && obj.userData.actionTrigger) || 'cheer';
        triggerAction(actTrigger);
      } else {
        triggerAction('cheer');
      }
    }
  });

  window.addEventListener('dblclick', () => {
    triggerAction('trophy_celebrate');
  });

  // ============================================================================
  // 7. 60FPS ANIMATION LOOP
  // ============================================================================
  const clock = new THREE.Clock();
  let lastTalkTick = 0;

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    if (isTalking || currentAction !== 'idle') {
      const tick = Math.floor(t * 9);
      if (tick !== lastTalkTick) {
        lastTalkTick = tick;
        updateFaceTexture(tick);
      }
    }

    if (!isDragging) {
      rotY += rotVelocityY;
      tiltX += tiltVelocityX;
      rotVelocityY *= 0.94;
      tiltVelocityX *= 0.88;
      tiltX = Math.max(-0.28, Math.min(0.35, tiltX));
    }
    worldGroup.rotation.y += (rotY - worldGroup.rotation.y) * 0.18;
    worldGroup.rotation.x += (tiltX - worldGroup.rotation.x) * 0.18;

    // Jump Physics
    if (jumpOffset > 0 || jumpVelocity !== 0) {
      jumpOffset += jumpVelocity;
      jumpVelocity -= 0.042;
      if (jumpOffset <= 0) {
        jumpOffset = 0;
        if (Math.abs(jumpVelocity) > 0.08) squashStretchY = 0.84;
        jumpVelocity = 0;
      }
    }
    squashStretchY += (1 - squashStretchY) * 0.16;
    characterGroup.scale.set(
      1 + (1 - squashStretchY) * 0.45,
      squashStretchY,
      1 + (1 - squashStretchY) * 0.45
    );

    // Idle & Action Kinematics
    const idleBreath = Math.sin(t * 2.8) * 0.06;
    const angryShake = currentAction === 'angry' ? Math.sin(t * 36) * 0.08 : 0;
    const trophyHop = currentAction === 'trophy_celebrate' ? Math.abs(Math.sin(t * 8)) * 0.25 : 0;
    characterGroup.position.y = idleBreath + jumpOffset + angryShake + trophyHop;
    if (currentAction === 'angry') {
      characterGroup.position.x = Math.sin(t * 40) * 0.08;
    } else {
      characterGroup.position.x = 0;
    }

    // Arms behavior
    let targetArmRX = 0, targetArmRZ = Math.sin(t * 2.2) * 0.07, targetArmRY = 0;
    let targetArmLX = 0, targetArmLZ = -Math.sin(t * 2.2) * 0.07, targetArmLY = 0;

    if (currentAction === 'drinking_tea' || currentAction === 'drinking_coffee') {
      // Bring right arm and tea mug up to mouth!
      targetArmRX = -1.55 + Math.sin(t * 4) * 0.15;
      targetArmRZ = 0.35;
      targetArmRY = -0.55;
      teaMugGroup.position.set(0.7, 0.45 + Math.sin(t * 4) * 0.08, 1.3);
      teaMugGroup.rotation.x = -0.35 + Math.sin(t * 4) * 0.15;
    } else if (currentAction === 'thinking') {
      // Right arm to chin
      targetArmRX = -1.6;
      targetArmRZ = 0.4;
      targetArmRY = -0.6;
      questionMarkGroup.position.y = 2.4 + Math.sin(t * 5) * 0.15;
      questionMarkGroup.rotation.y = t * 2;
    } else if (currentAction === 'streak_fire') {
      // Both fists up in triumph!
      targetArmRZ = 1.35 + Math.sin(t * 12) * 0.2;
      targetArmLZ = -1.35 - Math.sin(t * 12) * 0.2;
      targetArmRX = -0.4;
      targetArmLX = -0.4;
    } else if (currentAction === 'trophy_celebrate') {
      // Double arms cheering high with spinning trophy!
      targetArmRZ = 1.2 + Math.sin(t * 10) * 0.2;
      targetArmLZ = -1.2 - Math.sin(t * 10) * 0.2;
      trophyGroup.rotation.y = t * 3;
      trophyGroup.position.y = 2.6 + Math.sin(t * 6) * 0.15;
    } else if (currentAction === 'angry') {
      // Clenched shaking arms
      targetArmRZ = 0.35 + Math.sin(t * 30) * 0.15;
      targetArmLZ = -0.35 - Math.sin(t * 30) * 0.15;
      targetArmRX = -0.6;
      targetArmLX = -0.6;
    } else if (currentAction === 'wave') {
      targetArmRZ = 0.72 + Math.sin(t * 14) * 0.36;
      targetArmRX = -0.25;
    } else if (currentAction === 'cheer' || currentAction === 'dance') {
      targetArmRZ = 0.70 + Math.sin(t * 12) * 0.32;
      targetArmLZ = -0.70 - Math.sin(t * 12) * 0.32;
    }

    armRight.rotation.x += (targetArmRX - armRight.rotation.x) * 0.22;
    armRight.rotation.z += (targetArmRZ - armRight.rotation.z) * 0.22;
    armRight.rotation.y += (targetArmRY - armRight.rotation.y) * 0.22;

    armLeft.rotation.x += (targetArmLX - armLeft.rotation.x) * 0.22;
    armLeft.rotation.z += (targetArmLZ - armLeft.rotation.z) * 0.22;
    armLeft.rotation.y += (targetArmLY - armLeft.rotation.y) * 0.22;

    // Legs: Stomping when angry!
    let legSpeed = 2.6;
    let legAmp = 0.05;
    if (currentAction === 'angry') {
      legSpeed = 28.0;
      legAmp = 0.55;
    } else if (currentAction === 'walk' || currentAction === 'dance') {
      legSpeed = 10.5;
      legAmp = 0.42;
    }
    legFL.rotation.x =  Math.sin(t * legSpeed) * legAmp;
    legBR.rotation.x =  Math.sin(t * legSpeed) * legAmp;
    legFR.rotation.x = -Math.sin(t * legSpeed) * legAmp;
    legBL.rotation.x = -Math.sin(t * legSpeed) * legAmp;

    // Ears twitching
    const earSpeed = currentAction === 'angry' ? 24 : 2.4;
    const earAmp = currentAction === 'angry' ? 0.35 : 0.06;
    earLeft.rotation.z  =  Math.sin(t * earSpeed) * earAmp;
    earRight.rotation.z = -Math.sin(t * earSpeed) * earAmp;

    // Particles animation
    particles.forEach((p) => {
      if (!p.mesh.visible) return;
      p.life += 0.02;
      p.mesh.position.x += p.vx;
      p.mesh.position.y += p.vy;
      p.mesh.position.z += p.vz;
      p.mesh.rotation.x += p.rotX;
      p.mesh.rotation.y += p.rotY;
      if (p.life >= p.maxLife) {
        p.mesh.visible = false;
      }
    });

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  window.onload = () => {
    animate();
  };
})();
</script>
</body>
</html>
